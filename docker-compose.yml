services:
  postgres:
    image: postgres:16-alpine
    container_name: passpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passpass_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-passpass_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-passpass} -d $${POSTGRES_DB:-passpass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: passpass_postgres_data
